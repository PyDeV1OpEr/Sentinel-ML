[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectral"
version = "0.3.0"
description = "Real-time anomaly detection engine for time-series data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.25",
    "click>=8.1",
    "rich>=13.0",
    "websockets>=12.0",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]
kafka = [
    "confluent-kafka>=2.3",
]

[project.scripts]
spectral = "spectral.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/spectral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that take a long time to run",
    "integration: marks tests that need external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
