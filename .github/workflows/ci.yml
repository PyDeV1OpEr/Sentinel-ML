name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The CPU wheel avoids pulling multi-gigabyte CUDA libraries into CI.
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"

      - name: Install project
        run: pip install -e ".[dev,workbench]"

      - name: Lint
        run: ruff check src/ tests/ scripts/ workbench/

      - name: Compile
        run: python -m compileall -q src/ scripts/ workbench/

      - name: Test (no database integration)
        run: pytest -q -m "not integration"
